[package]
name = "easy-ref"
version = "0.1.0"
edition = "2024"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
gloo-net = { version = "0.7", default-features = false, features = ["http", "json"] }
gloo-timers = { version = "0.3", features = ["futures"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "Storage",
  "Window",
  "Document",
  "Element",
  "HtmlElement",
  "HtmlInputElement",
  "HtmlSelectElement",
  "DragEvent",
  "DataTransfer",
  "DomRect",
  "Blob",
  "BlobPropertyBag",
  "Url",
  "HtmlAnchorElement",
  "Navigator",
  "Clipboard",
  "RequestCache",
  "MediaQueryList",
  "File",
  "FileList",
] }
console_error_panic_hook = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
